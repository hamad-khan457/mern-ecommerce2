version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Part-I  │  Production Deployment on AWS EC2
#  Stack   │  PostgreSQL + Express (Node.js) + React (Nginx)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. PostgreSQL Database ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Named volume keeps data persistent across container restarts/rebuilds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Node.js / Express Backend ─────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME}/ecommerce-backend:latest   # pulled from Docker Hub
    container_name: ecommerce_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:    development
      PORT:        5000
      DB_HOST:     postgres          # service name = hostname inside Docker network
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET:  ${JWT_SECRET}
      CLIENT_URL:  ${CLIENT_URL}
      # AWS S3 (optional — remove if not using S3)
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:            ${AWS_REGION}
      S3_BUCKET_NAME:        ${S3_BUCKET_NAME}
    ports:
      - "5000:5000"
    networks:
      - ecommerce_net

  # ── 3. React / Nginx Frontend ─────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/ecommerce-frontend:latest  # pulled from Docker Hub
    container_name: ecommerce_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ecommerce_net

# ─────────────────────────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  ecommerce_net:
    driver: bridge
